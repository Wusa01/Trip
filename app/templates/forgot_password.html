{% extends "base.html" %}
{% block title %}نسيت كلمة المرور — سجل العشيرة{% endblock %}

{% block guest_content %}
<div class="login-screen">
  <div class="card login-card">
    <div style="text-align:center; margin-bottom:22px;">
      <h1>نسيت كلمة المرور؟</h1>
      <p class="muted" style="margin:0;">أدخل بريدك الإلكتروني المسجَّل وسنرسل لك رمز تفعيل لاستعادة الدخول</p>
    </div>

    <!-- الخطوة 1: البريد الإلكتروني -->
    <form id="forgot-step1">
      <div class="field" style="margin-bottom:20px;">
        <label for="forgot_email">البريد الإلكتروني</label>
        <input type="email" id="forgot_email" name="email" required autofocus>
      </div>
      <div id="forgot-step1-error" class="form-error" hidden></div>
      <button type="submit" id="forgot-step1-submit" style="width:100%; margin-bottom:10px;">إرسال رمز التفعيل</button>
      <a href="{{ url_for('auth.login_page') }}" class="btn-outline" style="display:block; text-align:center; width:100%; text-decoration:none;">رجوع لتسجيل الدخول</a>
    </form>

    <!-- الخطوة 2: الرمز وكلمة المرور الجديدة -->
    <form id="forgot-step2" hidden>
      <p class="muted small" style="margin-bottom:14px;">
        أرسلنا رمز تفعيل من 6 أرقام إلى <strong id="forgot-step2-email"></strong>.
      </p>
      <div class="field" style="margin-bottom:14px;">
        <label for="forgot_code">رمز التفعيل</label>
        <input type="text" id="forgot_code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="forgot_new_password">كلمة المرور الجديدة</label>
        <input type="password" id="forgot_new_password" name="new_password" required minlength="6">
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="forgot_confirm_password">تأكيد كلمة المرور الجديدة</label>
        <input type="password" id="forgot_confirm_password" name="confirm_password" required minlength="6">
      </div>
      <div id="forgot-step2-error" class="form-error" hidden></div>
      <button type="submit" id="forgot-step2-submit" style="width:100%; margin-bottom:10px;">تغيير كلمة المرور والدخول</button>
      <button type="button" id="forgot-back-btn" class="btn-outline" style="width:100%;">رجوع</button>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
{% endblock %}
